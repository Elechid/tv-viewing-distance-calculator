<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Elechid’s free 16:9 TV viewing distance calculator for Hong Kong homes. Compare 30°, 35° and 40° screen sizes, in English or Traditional Chinese.">
<title>TV viewing distance calculator | Elechid 音立</title>
<style>
:root { color-scheme: light; font: 16px/1.55 system-ui,sans-serif; color: #142c25; background: #f3f7f2; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 58rem; margin: auto; padding: clamp(1rem, 5vw, 4rem); }
header { display: flex; gap: 1rem; align-items: center; justify-content: space-between; }
header a { font-weight: 750; }
h1 { font-size: clamp(2rem, 6vw, 3.35rem); line-height: 1.12; letter-spacing: -.025em; margin-bottom: .65em; }
h2 { font-size: 1.05rem; margin: 0 0 .25rem; }
p { margin: .5rem 0 1rem; }
label { display: block; font-weight: 650; }
input, button { font: inherit; color: inherit; background: white; padding: .55rem .8rem; border: 1px solid #6a8170; border-radius: .55rem; }
input { width: 11rem; margin: .35rem 0 1rem; }
button { cursor: pointer; }
a { color: #14553c; text-underline-offset: .16em; }
.cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%, 13rem),1fr)); gap: .75rem; }
article { background: white; border: 1px solid #c9d9cf; border-radius: .85rem; padding: 1rem; }
article p { margin: .25rem 0; }
.size { font-size: 2.2rem; font-weight: 750; }
footer { margin-top: 1.5rem; }
nav { display: flex; flex-wrap: wrap; gap: .6rem 1.3rem; }
</style>
<script src="calculator.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main>
<header>
<a id="brand" href="https://elechid.com/en/pages/tv-size-calculator">Elechid 音立</a>
<button type="button" id="language" lang="zh-Hant">繁體中文</button>
</header>
<h1 id="title">TV viewing distance calculator</h1>
<p id="intro">Compare 16:9 TV sizes for your Hong Kong home. Measure from your seated eye position to the screen.</p>
<label for="distance" id="label">Viewing distance (metres)</label>
<input id="distance" type="number" inputmode="decimal" min="0.1" max="30" step="any" value="2.5" aria-describedby="error">
<p id="error" role="status" hidden></p>
<section id="results" class="cards" aria-live="polite" aria-label="Screen-size references"></section>
<noscript>This calculator requires JavaScript. 此計算器需要 JavaScript。</noscript>
<footer>
<p id="notes">Screen width excludes the bezel, stand and carton. Check the exact model’s cabinet fit, stand spacing and delivery route before buying.</p>
<nav aria-label="Elechid" id="links"></nav>
</footer>
</main>
</body>
</html>
